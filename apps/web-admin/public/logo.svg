<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="100%" height="100%">
  <defs>
    <!-- Ai badge gradient: red to bright magenta/purple -->
    <linearGradient id="aiBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="45%" stop-color="#DC2626" />
      <stop offset="75%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <!-- Roof shadow gradient -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <!-- Yellow face gradient -->
    <linearGradient id="yellowFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>

  <!-- Pantograph Bracket on Top -->
  <path d="M 36 12 L 40 4 L 80 4 L 84 12" fill="none" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="42" y="2" width="36" height="3.5" rx="1.5" fill="#334155" />

  <!-- Outer Train Body (White/Cream with thick black outline) -->
  <rect x="10" y="10" width="100" height="114" rx="20" fill="#F8FAFC" stroke="#000000" stroke-width="4" />

  <!-- Yellow Front Panel -->
  <path d="M 18 20 C 18 16 22 14 26 14 L 94 14 C 98 14 102 16 102 20 L 102 88 C 102 92 98 96 94 96 L 26 96 C 22 96 18 92 18 88 Z" fill="url(#yellowFace)" stroke="#000000" stroke-width="3" />

  <!-- Central Pill AI Badge -->
  <rect x="25" y="20" width="70" height="42" rx="21" fill="url(#aiBadgeGrad)" stroke="#000000" stroke-width="1.5" />

  <!-- "Ai" Text in Center of Pill -->
  <!-- A -->
  <text x="56" y="52" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">Ai</text>

  <!-- Sparkle Star at Top Right of AI Badge -->
  <g transform="translate(84, 25)">
    <path d="M 0 -8 Q 1 -1 8 0 Q 1 1 0 8 Q -1 1 -8 0 Q -1 -1 0 -8 Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Black Headlight Bar / Visor -->
  <rect x="24" y="68" width="72" height="18" rx="9" fill="#000000" />
  <!-- Left Headlights Pair -->
  <circle cx="34" cy="77" r="4.2" fill="#FFFFFF" />
  <circle cx="45" cy="77" r="4.2" fill="#FFFFFF" />
  <!-- Right Headlights Pair -->
  <circle cx="75" cy="77" r="4.2" fill="#FFFFFF" />
  <circle cx="86" cy="77" r="4.2" fill="#FFFFFF" />

  <!-- Purple / Violet Horizontal Stripe -->
  <rect x="10" y="96" width="100" height="10" fill="#A855F7" stroke="#000000" stroke-width="3" />

  <!-- Couplers / Buffers (Left and Right rounded shapes) -->
  <path d="M 26 106 C 26 106 32 106 36 111 C 39 116 38 122 34 125 C 28 126 24 122 24 116 Z" fill="#E2E8F0" stroke="#000000" stroke-width="3" />
  <circle cx="30" cy="116" r="3" fill="#64748B" />

  <path d="M 94 106 C 94 106 88 106 84 111 C 81 116 82 122 86 125 C 92 126 96 122 96 116 Z" fill="#E2E8F0" stroke="#000000" stroke-width="3" />
  <circle cx="90" cy="116" r="3" fill="#64748B" />

  <!-- Undercarriage Track Base / Cowcatcher -->
  <path d="M 18 124 L 24 136 L 96 136 L 102 124 Z" fill="#1E293B" stroke="#000000" stroke-width="3" stroke-linejoin="round" />
  <!-- Center coupler bar -->
  <rect x="52" y="123" width="16" height="10" rx="2" fill="#0F172A" stroke="#000000" stroke-width="2" />
</svg>
